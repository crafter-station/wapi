name: Release

# Tags only. A release is a deliberate act, not something a push to main should produce.
#
# `workflow_dispatch` exists so the demo film can be re-rendered and inspected without cutting a
# release — it uploads an artifact rather than touching a release in that case.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The workflow creates a release and uploads to it; nothing else needs write access.
permissions:
  contents: write

jobs:
  cli:
    name: CLI binaries
    runs-on: ubuntu-latest
    # Tags only. A manual dispatch is for re-rendering the film; it has no release to publish to,
    # and `softprops/action-gh-release` on a branch ref would try to create one named after it.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match CI. A binary built by a different Bun than the one the tests ran
          # under is not the artifact those tests passed against.
          bun-version: 1.2.23

      - name: Install
        run: bun install --frozen-lockfile

      - name: Guards
        # A tag can be pushed without a green CI run on that commit, so the checks that matter for
        # this artifact run again here. Cheap, and the alternative is shipping a CLI that does not
        # cover the API it claims to.
        run: |
          bun run typecheck
          bun ops/check-cli-in-sync.mjs
          bun ops/check-sdk-in-sync.mjs
          bun ops/check-docs-in-sync.mjs

      - name: Compile
        # Bun cross-compiles from one runner, so three platforms need one job rather than a matrix
        # of three. Named by platform-arch rather than by Bun's target string, because the person
        # downloading knows which machine they are on and not what `bun-darwin-arm64` means.
        run: |
          mkdir -p dist
          bun build apps/cli/src/index.ts --compile --target=bun-linux-x64    --outfile dist/wapi-linux-x64
          bun build apps/cli/src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/wapi-darwin-arm64
          bun build apps/cli/src/index.ts --compile --target=bun-windows-x64  --outfile dist/wapi-windows-x64.exe
          ls -la dist

      - name: Check the native one actually runs
        # The two cross-compiled binaries cannot be executed here, so this proves only the Linux
        # one — but a build that produces a file which is not a program is the failure worth
        # catching, and it fails the same way on all three when it happens.
        run: |
          chmod +x dist/wapi-linux-x64
          ./dist/wapi-linux-x64 --version

      - name: Checksums
        # So somebody can verify a download they did not watch being built.
        run: cd dist && sha256sum wapi-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          body: |
            ## wapi CLI

            ```bash
            # Linux, x64
            curl -fsSL -o wapi https://github.com/crafter-station/wapi/releases/download/${{ github.ref_name }}/wapi-linux-x64

            # macOS, Apple Silicon
            curl -fsSL -o wapi https://github.com/crafter-station/wapi/releases/download/${{ github.ref_name }}/wapi-darwin-arm64
            xattr -d com.apple.quarantine wapi   # else Gatekeeper refuses an unsigned download

            chmod +x wapi && sudo mv wapi /usr/local/bin/
            wapi login
            ```

            Windows, in PowerShell — put `wapi.exe` anywhere on your `PATH`:

            ```powershell
            irm https://github.com/crafter-station/wapi/releases/download/${{ github.ref_name }}/wapi-windows-x64.exe -OutFile wapi.exe
            ```

            Verify a download against `SHA256SUMS` if you did not watch it being built.

            Nothing to install alongside it — the Bun runtime is inside the binary, which is why
            they are large.
          fail_on_unmatched_files: true
          files: |
            dist/wapi-linux-x64
            dist/wapi-darwin-arm64
            dist/wapi-windows-x64.exe
            dist/SHA256SUMS

  video:
    name: Demo film
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node, not bun. Remotion drives a headless browser over a pipe that never connects
          # under Bun — every launch times out having apparently started the process — which is the
          # same reason ops/capture-demo.mjs runs under node.
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install
        run: bun install --frozen-lockfile

      - name: Render
        # Renders from the committed captures in apps/video/public, so this needs no database, no
        # gateway and no credentials — the recording already happened. A render pulls a headless
        # Chromium and takes minutes, which is why it lives here and not on the push path.
        run: bun run --cwd apps/video render

      - name: What came out
        run: ls -la apps/video/out

      - name: Keep it for inspection
        # On a manual run there is no release to attach to, so the film lands as an artifact.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: demo-film
          path: apps/video/out/

      - name: Attach to the release
        # The landing page points at `releases/latest/download/wapi-demo.mp4`, so the film has to
        # be on the release rather than in the repo — ~4.2 MB, regenerated rather than authored.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            apps/video/out/wapi-demo.mp4
            apps/video/out/wapi-demo.webm
            apps/video/out/poster.jpg
