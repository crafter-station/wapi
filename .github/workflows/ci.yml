name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the Docker images resolve a specific Bun, and lockfile validation can
          # differ across versions. A CI/image mismatch shows up as a frozen-install failure
          # at deploy time rather than here, which is the wrong place to find out.
          bun-version: 1.2.23

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        # Every package explicitly: the workspace has no single root program, and a silent
        # skip would defeat the point.
        run: |
          for p in packages/contracts packages/core packages/db packages/baileys-auth \
                   apps/api apps/gateway apps/webhook-worker; do
            echo "--- $p"
            ./node_modules/.bin/tsc --noEmit -p "$p/tsconfig.json"
          done

      - name: Test
        # The golden-fixture suite self-skips here: the mirrored spec it reads is gitignored
        # as WasenderAPI's copyrighted prose, so those assertions only run locally. Skipped
        # is honest; a green tick on tests that never ran would not be.
        run: bun test

      - name: Every workspace manifest reaches the Docker deps stage
        # `bun install --frozen-lockfile` validates against the WHOLE workspace, so a
        # manifest missing from the deps stage reads as lockfile drift and the image fails to
        # build. That broke the deploy three times before the Dockerfiles were unified, and
        # it only ever surfaced at deploy time. Now it fails here instead.
        run: |
          missing=0
          for pkg in packages/*/package.json apps/*/package.json; do
            grep -qF "COPY $pkg" Dockerfile || {
              echo "::error::$pkg is not copied into the Dockerfile deps stage"
              missing=1
            }
          done
          exit $missing

      - name: Contract is in sync
        # Only meaningful where the mirror exists. Guarded so CI does not fail on its absence.
        run: |
          if [ -f docs/wasenderapi/structured/endpoints.json ]; then
            bun run contracts:generate
            git diff --exit-code packages/contracts/src/generated/ \
              || (echo "::error::generated contract is stale — run bun run contracts:generate" && exit 1)
          else
            echo "mirrored spec absent; skipping regeneration check"
          fi
