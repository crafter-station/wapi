name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the Docker images resolve a specific Bun, and lockfile validation can
          # differ across versions. A CI/image mismatch shows up as a frozen-install failure
          # at deploy time rather than here, which is the wrong place to find out.
          bun-version: 1.2.23

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        # The same script `bun run typecheck` runs, deriving the project list from the
        # workspace globs. This used to be a hardcoded loop here, which had already
        # drifted: it omitted apps/web, so the dashboard was never typechecked in CI.
        run: bun run typecheck

      - name: Test
        # The golden-fixture suite self-skips here: the mirrored spec it reads is gitignored
        # as WasenderAPI's copyrighted prose, so those assertions only run locally. Skipped
        # is honest; a green tick on tests that never ran would not be.
        run: bun test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go SDK compiles
        # The drift guard proves every operation has a method; it says nothing about whether the
        # package still builds. Nothing else in CI is a Go toolchain, so this is the only thing
        # that would catch a Go-side break.
        run: |
          cd sdk/go
          test -z "$(gofmt -l .)" || { echo "gofmt: files need formatting"; gofmt -l .; exit 1; }
          go vet ./...
          go build ./...

      - name: SDK is in sync with the API
        # Two ways to drift: stale generated types, or an endpoint with no method. The second is
        # silent, which is why it is checked rather than left to review.
        run: bun ops/check-sdk-in-sync.mjs

      - name: Every workspace manifest reaches the Docker deps stage
        # This exact failure shipped four times and only ever surfaced at deploy time.
        run: node ops/check-dockerfile-manifests.mjs

      - name: Contract is in sync
        # Only meaningful where the mirror exists. Guarded so CI does not fail on its absence.
        run: |
          if [ -f docs/wasenderapi/structured/endpoints.json ]; then
            bun run contracts:generate
            git diff --exit-code packages/contracts/src/generated/ \
              || (echo "::error::generated contract is stale — run bun run contracts:generate" && exit 1)
          else
            echo "mirrored spec absent; skipping regeneration check"
          fi
