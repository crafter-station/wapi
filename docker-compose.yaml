services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GATEWAY_URL: http://gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    expose:
      - "3001"
    depends_on:
      - gateway
    networks:
      - dokploy-network

  # STATEFUL. One replica, always. A WhatsApp session is a WebSocket owned by exactly one
  # process, and two live sockets on one session escalates to a WhatsApp restriction
  # (see PLAN.md section 2). No published port and no domain: this RPC surface is
  # GATEWAY_TOKEN and the internal network.
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    deploy:
      replicas: 1
    environment:
      PORT: 3002
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    expose:
      - "3002"
    networks:
      - dokploy-network

  # Stateless: redeploys freely, unlike the gateway. Consumes the gateway's Redis channel
  # and delivers webhooks with retry/backoff via BullMQ.
  webhook-worker:
    build:
      context: .
      target: webhook-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - gateway
    networks:
      - dokploy-network

  # Dashboard. Stateless, redeploys freely.
  # HOSTNAME=0.0.0.0 is mandatory: without it Next binds 127.0.0.1 inside the container and
  # Traefik answers 404 (documented in the vps skill).
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GATEWAY_URL: http://gateway:3002
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    expose:
      - "3000"
    depends_on:
      - gateway
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
