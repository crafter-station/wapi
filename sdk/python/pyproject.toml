[project]
name = "wapi-sdk"
version = "0.1.0"
description = "Python client for the wapi WhatsApp REST API"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies, deliberately: this uses urllib from the standard library. An HTTP
# client that drags in a dependency tree is a liability in something dropped into other
# people's projects, and this is JSON in, JSON out, one header.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wapi"]
